name: 🚀 Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 📦 Build & Release
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 📦 Install pnpm
        run: npm install -g pnpm@9

      - name: 📥 Install dependencies
        run: pnpm install

      - name: 🧪 Validate code (lint & typecheck)
        run: pnpm check

      - name: 🏗️ Build Application
        # electron-builder avec --publish never pour générer l'installateur localement sans collision d'API
        run: pnpm exec electron-vite build && pnpm exec electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🎉 Create or Update GitHub Release
        # Utilisation de la CLI officielle GitHub 'gh' : idempotent, aucune dépendance d'action Node 20, zéro warning
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag existe déjà, mise à jour des assets avec --clobber..."
            gh release upload "$tag" dist/Novx-setup.exe dist/latest.yml --clobber
          else
            echo "Création de la release $tag..."
            gh release create "$tag" dist/Novx-setup.exe dist/latest.yml --title "$tag" --generate-notes
          fi
