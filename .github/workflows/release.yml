name: 🚀 Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 📦 Build & Release
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 📥 Install dependencies
        run: pnpm install

      - name: 🧪 Validate code (lint & typecheck)
        run: pnpm check

      - name: 🏗️ Build Application
        # electron-builder avec --publish never pour générer l'installateur sans appel API direct
        run: pnpm exec electron-vite build && pnpm exec electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🎉 Create GitHub Release
        # Même approche éprouvée que SwitchMaster : softprops/action-gh-release publie 1 seule release propre pour le tag
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Novx-setup.exe
            dist/latest.yml
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
